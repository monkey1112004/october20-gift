<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HangOS v1.0</title>
<style>
  :root{
    --bg:#0a0e0a;
    --panel:#0f1510;
    --green:#39ff14;
    --green-dim:#1f8a12;
    --green-soft:#7dff6b;
    --amber:#ffcc66;
    --text:#c9ffc0;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(circle at 50% 0%, #0f1a10 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-x:hidden;
  }
  /* Hiệu ứng scanline */
  body::after{
    content:""; position:fixed; inset:0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.12) 3px);
    pointer-events:none; z-index:9999; opacity:.5;
  }

  .terminal{
    width:100%; max-width:750px;
    background:var(--panel);
    border:1px solid var(--green-dim);
    border-radius:10px;
    box-shadow: 0 0 0 1px rgba(57,255,20,.08), 0 0 40px rgba(57,255,20,.12), inset 0 0 60px rgba(57,255,20,.03);
    overflow:hidden;
    animation: bootIn .6s ease-out;
  }
  @keyframes bootIn{ from{opacity:0; transform:translateY(8px) scale(.99);} to{opacity:1; transform:none;} }

  .titlebar{
    display:flex; align-items:center; gap:8px;
    padding:10px 14px; background:#0b120c; border-bottom:1px solid var(--green-dim);
    font-size:12px; color:var(--green-soft); letter-spacing:.5px;
  }
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .dot.r{background:#ff5f56;} .dot.y{background:#ffbd2e;} .dot.g{background:#27c93f;}
  .titlebar span.path{margin-left:auto; opacity:.7;}

  .screen{
    padding:22px 20px 26px; min-height:400px; display:flex; flex-direction:column; gap:10px;
    font-size:15px; line-height:1.6; max-height: 80vh; overflow-y: auto;
  }
  /* Custom scrollbar */
  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 4px; }

  .line{white-space:pre-wrap; word-break:break-word;}
  .prompt{color:var(--green);}
  .prompt::before{content:"$ "; color:var(--green-dim);}
  .dim{color:var(--green-dim);}
  .amber{color:var(--amber);}
  .soft{color:var(--green-soft);}

  .input-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .input-row .prompt{flex:0 0 auto;}
  input[type="text"], input[type="email"]{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--green); font-family:var(--mono); font-size:15px; caret-color:var(--green);
  }
  input::placeholder{color:var(--green-dim); opacity:.6;}

  .btn{
    display:inline-block; margin-top:10px; padding:8px 16px;
    background:transparent; border:1px solid var(--green); color:var(--green);
    font-family:var(--mono); font-size:13px; letter-spacing:1px; cursor:pointer;
    border-radius:6px; transition:.2s; text-transform:uppercase;
  }
  .btn:hover{ background:var(--green); color:#02140a; box-shadow:0 0 18px rgba(57,255,20,.55); }

  .hidden{display:none !important;}

  /* CSS cho thiệp và hoa */
  .card{
    margin-top:10px; border:1px dashed var(--green-dim); border-radius:10px;
    padding:18px; background: linear-gradient(180deg, rgba(57,255,20,.05), rgba(57,255,20,0));
    animation: cardIn .9s ease-out;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(10px); filter:blur(4px);} to{opacity:1; transform:none; filter:blur(0);} }
  .card h1{ font-size:18px; color:var(--green); letter-spacing:1px; margin-bottom:10px; }
  .card p{margin:8px 0;}
  
  .flower{ font-size:60px; text-align:center; display:block; margin: 10px 0; animation: sway 3s ease-in-out infinite; text-shadow: 0 0 15px var(--green); }
  @keyframes sway{ 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }
</style>
</head>
<body>

  <div class="terminal" role="main">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span>&nbsp;hang_os_terminal</span>
      <span class="path" id="path-display">/</span>
    </div>

    <div class="screen" id="screen">
      <div id="output"></div>
      
      <!-- Khung nhập lệnh -->
      <div class="input-row" id="input-area">
        <span class="prompt" id="user-prompt">guest@hangos:~$</span>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="type a command..." />
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  const output = document.getElementById("output");
  const cmdInput = document.getElementById("cmd");
  const userPrompt = document.getElementById("user-prompt");
  const pathDisplay = document.getElementById("path-display");

  let currentUser = "guest";
  let currentPath = "~";
  let isLoggedIn = false;

  // Lệnh khởi động
  const bootSeq = [
    "HangOS 1.0 LTS (GNU/Linux 5.15.0-generic x86_64)",
    " * Starting network manager... [ OK ]",
    " * Mounting virtual file system... [ OK ]",
    "",
    "Welcome to HangOS.",
    "Type 'help' for a list of commands.",
    "Type 'login' to authenticate."
  ];

  function print(text, className="line"){
    const div = document.createElement("div");
    div.className = className;
    div.innerHTML = text;
    output.appendChild(div);
    document.getElementById("screen").scrollTop = document.getElementById("screen").scrollHeight;
  }

  // Hiệu ứng gõ chữ lúc đầu
  function typeBoot(i=0){
    if(i >= bootSeq.length){
      cmdInput.focus();
      return;
    }
    print(bootSeq[i]);
    setTimeout(() => typeBoot(i+1), 150);
  }

  // Cập nhật prompt
  function updatePrompt(){
    userPrompt.textContent = `${currentUser}@hangos:${currentPath}$`;
    pathDisplay.textContent = currentPath === "~" ? "/" : `/${currentPath}`;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Xử lý lệnh
  function handleCommand(raw){
    const args = raw.trim().split(" ");
    const cmd = args[0].toLowerCase();
    
    if(!cmd) return;
    print(`<span class="prompt">${currentUser}@hangos:${currentPath}$</span> ${escapeHtml(raw)}`);

    if(cmd === "help"){
      print("Available commands:");
      print("  <span class='amber'>login</span>     - Authenticate as a specific user");
      print("  <span class='amber'>ls</span>        - List directory contents");
      print("  <span class='amber'>cd</span> <span class='dim'>&lt;dir&gt;</span>  - Change directory");
      print("  <span class='amber'>cat</span> <span class='dim'>&lt;file&gt;</span> - Read a file");
      print("  <span class='amber'>clear</span>     - Clear terminal");
    } 
    else if(cmd === "clear"){
      output.innerHTML = "";
    }
    else if(cmd === "login"){
      if(isLoggedIn){
        print("Already logged in.");
      } else {
        print("Username:", "dim");
        cmdInput.placeholder = "Enter username...";
        cmdInput.dataset.action = "login_user";
        // Đổi sự kiện Enter tạm thời (xử lý ở dưới)
      }
    }
    else if(cmd === "ls"){
      if(!isLoggedIn && currentPath !== "~"){
        print("Permission denied. Please login first.");
      } else if(currentPath === "~"){
        print("<span class='soft'>thiep/</span>  <span class='soft'>hoa/</span>  <span class='soft'>qua/</span>");
      } else {
        print("(empty directory)");
      }
    }
    else if(cmd === "cd"){
      const target = args[1];
      if(!target || target === "~"){
        currentPath = "~";
      } 
      else if(!isLoggedIn && currentPath === "~"){
        print("Permission denied. Please login first.");
      }
      else if(target === "thiep" || target === "hoa" || target === "qua"){
        currentPath = target;
      }
      else if(target === ".."){
        currentPath = "~";
      }
      else {
        print(`cd: no such file or directory: ${target}`);
      }
      updatePrompt();
    }
    else if(cmd === "cat"){
      const file = args[1];
      if(currentPath === "thiep" && file === "thiep.txt"){
        printCard();
      } else if(currentPath === "hoa" && file === "hoa.txt"){
        printFlower();
      } else if(currentPath === "qua" && file === "dieu_uoc.sh"){
        printWishForm();
      } else {
        print(`cat: ${file || ""}: No such file or directory`);
      }
    }
    else {
      print(`bash: ${escapeHtml(cmd)}: command not found`);
    }
  }

  // --- Các function in nội dung ---
  function printCard(){
    print(`
      <div class="card">
        <h1>&gt; cat thiep.txt</h1>
        <p>Chúc Hằng một ngày 20/10 thật vui vẻ nhé.</p>
        <p>Mong cậu luôn giữ được sự tự tin, sự tò mò và những điều rất riêng của mình.</p>
        <p>Chúc cậu có thêm thật nhiều ngày vui, gặp được nhiều điều thú vị.</p>
        <p class="dim">— một món quà nhỏ, viết bằng vài dòng code.</p>
      </div>
    `);
  }

  function printFlower(){
    print(`<span class="flower">🌷</span>`);
    print("<span class='dim'>// a digital flower blooming for you</span>");
  }

  function printWishForm(){
    print("Initializing wish module...");
    print("Please type your wish below and press Enter:");
    cmdInput.placeholder = "Type your wish here...";
    cmdInput.dataset.action = "submit_wish";
  }

  // Bắt sự kiện nhập liệu
  cmdInput.addEventListener("keydown", (e) => {
    if(e.key !== "Enter") return;
    const val = cmdInput.value.trim();
    if(!val) return;
    
    cmdInput.value = "";
    const action = cmdInput.dataset.action;

    if(action === "login_user"){
      cmdInput.dataset.action = "";
      cmdInput.placeholder = "type a command...";
      if(val.toLowerCase() === "hang" || val.toLowerCase() === "hằng"){
        currentUser = "hang";
        isLoggedIn = true;
        updatePrompt();
        print(`Password for ${val}: `);
        // Giả lập đăng nhập thành công
        setTimeout(() => {
          print("Authentication successful. Welcome back, Hang!");
          print("You can now access the directories: thiep, hoa, qua");
        }, 300);
      } else {
        print("User not found. Try 'login' again.");
      }
    } 
    else if(action === "submit_wish"){
      cmdInput.dataset.action = "";
      cmdInput.placeholder = "type a command...";
      
      // Tạo mailto link
      const email = "email_cua_cau@gmail.com"; // <-- CẬU SỬA EMAIL CỦA CẬU VÀO ĐÂY
      const subject = encodeURIComponent(`[HangOS] Diep uoc tu Hang`);
      const body = encodeURIComponent(`Hang da gui mot dieu uoc:\n\n"${val}"`);
      
      print("Encrypting wish...");
      setTimeout(() => {
        print("Saving to remote server... [ OK ]");
        print(`Your wish has been logged:`);
        print(`<span class="amber">"${escapeHtml(val)}"</span>`);
        print(`<a href="mailto:${email}?subject=${subject}&body=${body}" target="_blank" class="btn" style="text-decoration:none; margin-top:15px;">[ Gửi điều ước về cho Thái ]</a>`);
        print("<span class='dim'>Bấm vào nút trên để gửi điều ước qua Email nhé!</span>");
      }, 500);
    }
    else {
      handleCommand(val);
    }
  });

  // Init
  updatePrompt();
  typeBoot();
})();
</script>
</body>
</html>
